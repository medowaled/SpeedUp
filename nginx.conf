# ==============================================================================
# NGINX CONFIGURATION SNIPPET FOR BROWSER CACHING & COMPRESSION
# Place inside server {} or location {} block
# ==============================================================================

# Enable Gzip Compression
gzip on;
gzip_comp_level 5;
gzip_min_length 256;
gzip_proxied any;
gzip_vary on;
gzip_types
    application/atom+xml
    application/javascript
    application/json
    application/ld+json
    application/manifest+json
    application/rss+xml
    application/vnd.geo+json
    application/vnd.ms-fontobject
    application/x-font-ttf
    application/x-web-app-manifest+json
    application/xhtml+xml
    application/xml
    font/opentype
    image/bmp
    image/svg+xml
    image/x-icon
    text/cache-manifest
    text/css
    text/plain
    text/vcard
    text/vnd.rim.location.xloc
    text/vtt
    text/x-component
    text/x-cross-domain-policy;

# Static Assets Browser Caching (1 Year max-age, immutable)
location ~* \.(?:webp|png|jpg|jpeg|svg|gif|ico|woff2|woff|ttf|eot|css|js)$ {
    expires 365d;
    add_header Cache-Control "public, max-age=31536000, immutable";
    access_log off;
    log_not_found off;
}
